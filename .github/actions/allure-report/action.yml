name: 'Allure Report and Artifacts'
description: 'Generates Allure report and uploads pipeline artifacts'

runs:
  using: "composite"
  steps:
    - name: Generate Allure Report
      shell: bash
      run: mvn allure:report || echo "Report generation skipped or failed"

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 14

    - name: Upload Allure HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: allure-html-report
        path: allure-report/ # Matches the POM outputDirectory
        retention-days: 14
