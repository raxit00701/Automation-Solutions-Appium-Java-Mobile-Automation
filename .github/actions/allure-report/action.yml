name: Generate Allure Report

description: >
  Generate Allure HTML report, preserve history,
  and upload test artifacts.

runs:
  using: composite

  steps:

    # ---------------------------------------------------------
    # Restore previous Allure history
    # ---------------------------------------------------------

    - name: Restore Allure history cache
      uses: actions/cache@v4
      with:
        path: .allure-history
        key: allure-history-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          allure-history-${{ runner.os }}-${{ github.ref_name }}-
          allure-history-${{ runner.os }}-

    # ---------------------------------------------------------
    # Install Allure CLI if necessary
    # ---------------------------------------------------------

    - name: Install Allure CLI
      shell: powershell
      run: |

        $allure = Get-Command allure -ErrorAction SilentlyContinue

        if ($null -eq $allure) {

            Write-Host "Allure CLI not found."

            npm install -g allure-commandline

        }
        else {

            Write-Host "Allure already installed."

        }

        allure --version

    # ---------------------------------------------------------
    # Restore history into report
    # ---------------------------------------------------------

    - name: Inject Allure history
      shell: powershell
      run: |

        if (Test-Path ".allure-history") {

            New-Item `
                -ItemType Directory `
                -Force `
                -Path "allure-results\history" `
                | Out-Null

            Copy-Item `
                ".allure-history\*" `
                "allure-results\history\" `
                -Recurse `
                -Force
        }

    # ---------------------------------------------------------
    # Generate report
    # ---------------------------------------------------------

    - name: Generate Allure report
      shell: powershell
      run: |

        if (-not (Test-Path "allure-results")) {
            throw "allure-results directory does not exist."
        }

        allure generate `
            allure-results `
            --clean `
            -o allure-report

    # ---------------------------------------------------------
    # Persist history
    # ---------------------------------------------------------

    - name: Save Allure history
      shell: powershell
      run: |

        if (Test-Path "allure-report\history") {

            if (Test-Path ".allure-history") {
                Remove-Item ".allure-history" -Recurse -Force
            }

            New-Item `
                -ItemType Directory `
                -Force `
                -Path ".allure-history" `
                | Out-Null

            Copy-Item `
                "allure-report\history\*" `
                ".allure-history\" `
                -Recurse `
                -Force
        }

    # ---------------------------------------------------------
    # Upload artifacts
    # ---------------------------------------------------------

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-${{ github.run_number }}
        path: allure-report
        if-no-files-found: warn
        retention-days: 14

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-${{ github.run_number }}
        path: allure-results
        if-no-files-found: warn
        retention-days: 14

    - name: Upload test diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: appium-test-diagnostics-${{ github.run_number }}
        path: |
          appium.log
          adb-devices.txt
          android-properties.txt
          target/surefire-reports
          screenshots
          videos
        if-no-files-found: warn
        retention-days: 14
