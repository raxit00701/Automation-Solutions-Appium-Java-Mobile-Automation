name: 'Allure Report and Artifacts'
description: 'Generates Allure report and uploads pipeline and Appium artifacts'

runs:
  using: "composite"
  steps:
    - name: Generate Allure Report
      shell: bash
      run: mvn allure:report || echo "Report generation skipped or failed"

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 14

    - name: Upload Allure HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: allure-html-report
        path: allure-report/
        retention-days: 14

    - name: Upload Appium Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: appium-server-logs
        path: |
          appium.log
          appium-error.log
          adb-devices.txt
          android-properties.txt
        retention-days: 14
