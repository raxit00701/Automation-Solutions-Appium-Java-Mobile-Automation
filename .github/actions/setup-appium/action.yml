name: Setup Appium Android
description: Prepare Java, Node, Maven, Appium, Android SDK and start the existing local Android emulator.

inputs:
  environment:
    description: GitHub Environment name
    required: true
  environment-config:
    description: Multiline environment configuration from GitHub Environment variable
    required: true
  emulator-mode:
    description: head or headless
    required: true
    default: headless
  avd-name:
    description: Android Virtual Device name
    required: true
    default: Pixel_API_35
  emulator-path:
    description: Path to emulator.exe
    required: true
    default: C:\Android\emulator\emulator.exe

runs:
  using: composite
  steps:
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven

    - name: Load environment configuration
      shell: powershell
      env:
        ENV_CONFIG: ${{ inputs.environment-config }}
      run: |
        Write-Host "=========================================="
        Write-Host "Environment: ${{ inputs.environment }}"
        Write-Host "=========================================="
        if ([string]::IsNullOrWhiteSpace($env:ENV_CONFIG)) { throw "Environment configuration is empty." }
        $lines = $env:ENV_CONFIG -split "`r?`n"
        foreach ($line in $lines) {
            $line = $line.Trim()
            if ([string]::IsNullOrWhiteSpace($line) -or $line.StartsWith("#")) { continue }
            if ($line -notmatch "^([^=]+)=(.*)$") {
                Write-Warning "Skipping invalid environment line: $line"
                continue
            }
            $name = $Matches[1].Trim()
            $value = $Matches[2].Trim()
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Loaded: $name"
        }

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Appium
      shell: powershell
      run: |
        $appium = Get-Command appium -ErrorAction SilentlyContinue
        if ($null -eq $appium) {
            Write-Host "Installing Appium..."
            npm install -g appium
        } else {
            Write-Host "Appium already installed at $($appium.Source)"
        }
        appium --version

    - name: Install UiAutomator2 driver
      shell: powershell
      run: |
        $driverOutput = appium driver list --installed 2>$null
        if ($driverOutput -match "uiautomator2") {
            Write-Host "UiAutomator2 driver is already installed."
        } else {
            Write-Host "Installing UiAutomator2..."
            appium driver install uiautomator2
        }

    - name: Verify ADB
      shell: powershell
      run: |
        $adb = if ([string]::IsNullOrWhiteSpace($env:ADB_PATH)) { "adb" } else { $env:ADB_PATH }
        & $adb version
        & $adb devices

    - name: Start Android emulator
      shell: powershell
      env:
        EMULATOR_PATH: ${{ inputs.emulator-path }}
        AVD_NAME: ${{ inputs.avd-name }}
        EMULATOR_MODE: ${{ inputs.emulator-mode }}
      run: |
        $adb = if ([string]::IsNullOrWhiteSpace($env:ADB_PATH)) { "adb" } else { $env:ADB_PATH }
        & $adb start-server
        $deviceFound = $false
        $devices = & $adb devices
        foreach ($line in $devices) {
            if ($line -match "^emulator-\d+\s+device$") {
                $deviceFound = $true
                break
            }
        }
        if (-not $deviceFound) {
            $arguments = @("-avd", $env:AVD_NAME, "-no-boot-anim")
            if ($env:EMULATOR_MODE -eq "headless") {
                $arguments += "-no-window"
                $arguments += "-no-audio"
            }
            Start-Process -FilePath $env:EMULATOR_PATH -ArgumentList $arguments -WorkingDirectory (Split-Path $env:EMULATOR_PATH) -WindowStyle Normal
        }

    - name: Wait for Android emulator
      shell: powershell
      run: |
        $adb = if ([string]::IsNullOrWhiteSpace($env:ADB_PATH)) { "adb" } else { $env:ADB_PATH }
        $timeout = 300
        $elapsed = 0
        while ($elapsed -lt $timeout) {
            $devices = & $adb devices
            $deviceReady = $devices | Where-Object { $_ -match "^emulator-\d+\s+device$" }
            if ($null -ne $deviceReady) { break }
            Start-Sleep -Seconds 5
            $elapsed += 5
        }
        $bootTimeout = 300
        $bootElapsed = 0
        while ($bootElapsed -lt $bootTimeout) {
            $deviceId = (& $adb devices | Where-Object { $_ -match "^emulator-\d+\s+device$" } | Select-Object -First 1) -split "\s+"
            if ($deviceId.Count -gt 0) {
                $serial = $deviceId[0]
                $boot = (& $adb -s $serial shell getprop sys.boot_completed 2>$null).Trim()
                if ($boot -eq "1") { break }
            }
            Start-Sleep -Seconds 5
            $bootElapsed += 5
        }
