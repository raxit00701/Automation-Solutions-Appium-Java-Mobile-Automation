name: Setup Appium Android Environment
description: Setup Java, Node, Android SDK, Appium, UiAutomator2 and Android emulator

inputs:
  headless:
    description: Run Android emulator headless
    required: false
    default: "true"

runs:
  using: composite

  steps:

    # ============================================================
    # JAVA
    # ============================================================

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
        cache: maven


    # ============================================================
    # NODE
    # ============================================================

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"


    # ============================================================
    # ANDROID ENVIRONMENT
    # ============================================================

    - name: Configure Android environment
      shell: powershell
      run: |
        $androidHome = "C:\Android\android-sdk"

        Write-Host "ANDROID_HOME = $androidHome"

        if (-not (Test-Path $androidHome)) {
            New-Item -ItemType Directory -Force -Path $androidHome | Out-Null
        }

        "ANDROID_HOME=$androidHome" | Out-File `
          -FilePath $env:GITHUB_ENV `
          -Append `
          -Encoding utf8

        "ANDROID_SDK_ROOT=$androidHome" | Out-File `
          -FilePath $env:GITHUB_ENV `
          -Append `
          -Encoding utf8

        $env:ANDROID_HOME = $androidHome
        $env:ANDROID_SDK_ROOT = $androidHome

        $paths = @(
            "$androidHome\platform-tools",
            "$androidHome\emulator",
            "$androidHome\cmdline-tools\latest\bin"
        )

        foreach ($path in $paths) {
            if (Test-Path $path) {
                Add-Content $env:GITHUB_PATH $path
                Write-Host "Added PATH: $path"
            }
        }


    # ============================================================
    # ANDROID SDK
    # ============================================================

    - name: Install Android SDK components
      shell: powershell
      run: |

        $sdkmanager = "C:\Android\android-sdk\cmdline-tools\latest\bin\sdkmanager.bat"

        if (-not (Test-Path $sdkmanager)) {
            Write-Error "sdkmanager not found: $sdkmanager"
            exit 1
        }

        Write-Host "Accepting Android SDK licenses..."

        & $sdkmanager --licenses | ForEach-Object {
            "y"
        }

        Write-Host "Installing Android SDK components..."

        & $sdkmanager `
          "platform-tools" `
          "emulator" `
          "build-tools;35.0.0" `
          "platforms;android-35" `
          "system-images;android-35;google_apis;x86_64"

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Android SDK installation failed."
            exit 1
        }


    # ============================================================
    # VERIFY ANDROID TOOLS
    # ============================================================

    - name: Verify Android tools
      shell: powershell
      run: |

        Write-Host ""
        Write-Host "================================================"
        Write-Host "           ANDROID TOOL VERIFICATION"
        Write-Host "================================================"
        Write-Host ""

        Write-Host "ADB:"
        adb version

        Write-Host ""
        Write-Host "Emulator:"
        emulator -version

        Write-Host ""
        Write-Host "SDK Manager:"
        sdkmanager --version

        Write-Host ""


    # ============================================================
    # APPIUM
    # ============================================================

    - name: Install Appium
      shell: powershell
      run: |

        Write-Host "Installing Appium..."

        npm install -g appium

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Appium installation failed."
            exit 1
        }

        Write-Host ""
        Write-Host "Appium version:"
        appium --version


    # ============================================================
    # APPIUM UIAUTOMATOR2
    # ============================================================

    - name: Install UiAutomator2 driver
      shell: powershell
      run: |

        Write-Host "Installing UiAutomator2 driver..."

        appium driver install uiautomator2

        if ($LASTEXITCODE -ne 0) {
            Write-Error "UiAutomator2 installation failed."
            exit 1
        }

        Write-Host ""
        Write-Host "Installed Appium drivers:"
        appium driver list --installed


    # ============================================================
    # CREATE AVD
    # ============================================================

    - name: Create Android emulator
      shell: powershell
      run: |

        $avdName = "CI_Android"
        $package = "system-images;android-35;google_apis;x86_64"

        Write-Host ""
        Write-Host "================================================"
        Write-Host "          CREATING ANDROID EMULATOR"
        Write-Host "================================================"
        Write-Host ""

        Write-Host "AVD name: $avdName"
        Write-Host "System image: $package"

        $existingAvd = & avdmanager list avd 2>$null

        if ($existingAvd -match "Name:\s*$avdName") {

            Write-Host "AVD already exists."

        }
        else {

            Write-Host "Creating AVD..."

            $yes = "no"

            $yes | & avdmanager create avd `
                --name $avdName `
                --package $package `
                --device "pixel_2" `
                --force

            if ($LASTEXITCODE -ne 0) {
                Write-Error "Failed to create Android AVD."
                exit 1
            }
        }

        Write-Host ""
        Write-Host "Available AVDs:"
        emulator -list-avds


    # ============================================================
    # START EMULATOR
    # ============================================================

    - name: Start Android emulator
      shell: powershell
      env:
        HEADLESS: ${{ inputs.headless }}
      run: |

        $avdName = "CI_Android"
        $emulatorExe = "C:\Android\android-sdk\emulator\emulator.exe"

        Write-Host ""
        Write-Host "================================================"
        Write-Host "          STARTING ANDROID EMULATOR"
        Write-Host "================================================"
        Write-Host ""

        if (-not (Test-Path $emulatorExe)) {
            Write-Error "emulator.exe not found: $emulatorExe"
            exit 1
        }

        Write-Host "AVD: $avdName"
        Write-Host "HEADLESS: $env:HEADLESS"

        $arguments = @(
            "-avd", $avdName,
            "-no-snapshot",
            "-no-audio",
            "-no-boot-anim",
            "-gpu", "swiftshader_indirect"
        )

        if ($env:HEADLESS -eq "true") {

            Write-Host "Starting emulator in HEADLESS mode..."

            $arguments += "-no-window"

        }
        else {

            Write-Host "Starting emulator in HEADED mode..."

        }

        Write-Host ""
        Write-Host "Command:"
        Write-Host "$emulatorExe $($arguments -join ' ')"
        Write-Host ""

        $process = Start-Process `
            -FilePath $emulatorExe `
            -ArgumentList $arguments `
            -PassThru `
            -WindowStyle Hidden

        Write-Host "Emulator process started."
        Write-Host "PID: $($process.Id)"

        # Give emulator process time to register with ADB
        Start-Sleep -Seconds 10

        Write-Host ""
        Write-Host "ADB devices after emulator startup:"

        adb start-server

        adb devices


    # ============================================================
    # WAIT FOR EMULATOR
    # ============================================================

    - name: Wait for Android emulator
      shell: powershell
      run: |

        $udid = "emulator-5554"

        Write-Host ""
        Write-Host "================================================"
        Write-Host "          WAITING FOR ANDROID EMULATOR"
        Write-Host "================================================"
        Write-Host ""

        Write-Host "Waiting for: $udid"

        $deviceReady = $false

        for ($i = 0; $i -lt 60; $i++) {

            $devices = adb devices

            Write-Host ""
            Write-Host "ADB devices:"
            $devices

            if ($devices -match "$udid\s+device") {

                Write-Host ""
                Write-Host "Android emulator detected."

                $deviceReady = $true
                break
            }

            Write-Host "Emulator not ready. Attempt $($i + 1)/60"

            Start-Sleep -Seconds 2
        }

        if (-not $deviceReady) {

            Write-Error "Android emulator '$udid' was not detected."

            Write-Host ""
            Write-Host "Final ADB devices:"
            adb devices

            Write-Host ""
            Write-Host "Running emulator processes:"
            Get-Process emulator -ErrorAction SilentlyContinue

            exit 1
        }


    # ============================================================
    # WAIT FOR ANDROID BOOT
    # ============================================================

    - name: Wait for Android boot
      shell: powershell
      run: |

        $udid = "emulator-5554"

        Write-Host ""
        Write-Host "================================================"
        Write-Host "           WAITING FOR ANDROID BOOT"
        Write-Host "================================================"
        Write-Host ""

        for ($i = 0; $i -lt 90; $i++) {

            $boot = adb -s $udid shell getprop sys.boot_completed 2>$null

            $boot = ($boot | Out-String).Trim()

            Write-Host "Boot status: '$boot'"

            if ($boot -eq "1") {

                Write-Host ""
                Write-Host "Android boot completed."
                break
            }

            Start-Sleep -Seconds 2
        }

        $boot = adb -s $udid shell getprop sys.boot_completed 2>$null
        $boot = ($boot | Out-String).Trim()

        if ($boot -ne "1") {

            Write-Error "Android emulator did not finish booting."

            Write-Host ""
            Write-Host "ADB devices:"
            adb devices

            exit 1
        }


    # ============================================================
    # DISABLE ANIMATIONS
    # ============================================================

    - name: Configure emulator
      shell: powershell
      run: |

        $udid = "emulator-5554"

        if ($env:DISABLE_WINDOW_ANIMATION -eq "true") {

            Write-Host "Disabling Android animations..."

            adb -s $udid shell settings put global window_animation_scale 0
            adb -s $udid shell settings put global transition_animation_scale 0
            adb -s $udid shell settings put global animator_duration_scale 0
        }

        Write-Host ""
        Write-Host "Final emulator state:"
        adb devices

        Write-Host ""
        Write-Host "Android emulator is READY."
