name: 'Setup Appium and Dependencies'
description: 'Installs JDK, Appium, caches dependencies, and sets dynamic env variables'
inputs:
  environment:
    description: 'Target Environment'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven' 

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Appium & UiAutomator2
      shell: bash
      run: |
        npm install -g appium
        appium driver install uiautomator2 || echo "UiAutomator2 already installed"

    - name: Generate .env from GitHub Environment Variable
      shell: powershell
      env:
        # Pulls all variables from the active environment into a JSON object
        GITHUB_VARS_JSON: ${{ toJSON(vars) }}
      run: |
        Write-Host "Extracting variables for the ${{ inputs.environment }} environment..."
        
        # Convert the GitHub vars JSON into a PowerShell object
        $varsObj = $env:GITHUB_VARS_JSON | ConvertFrom-Json
        
        # Since you only have 1 variable per environment containing a multi-line string,
        # we dynamically grab the value of that first/only variable.
        $envContent = $varsObj.PSObject.Properties.Value | Select-Object -First 1
        
        # Write the multi-line string directly to the .env file
        Set-Content -Path ".env" -Value $envContent
        
        Write-Host "Successfully generated .env file!"
