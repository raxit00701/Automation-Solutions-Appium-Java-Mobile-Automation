name: Setup Appium Environment

description: Install and configure Java, Node, Appium, Android SDK and emulator

inputs:

  headless:
    description: Run Android emulator in headless mode
    required: false
    default: 'true'


runs:
  using: composite

  steps:

    # =========================================================
    # JAVA
    # =========================================================

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven


    # =========================================================
    # NODE.JS
    # =========================================================

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'


    # =========================================================
    # ANDROID ENVIRONMENT
    # =========================================================

    - name: Configure Android environment
      shell: powershell
      run: |

        Write-Host ""
        Write-Host "================================================"
        Write-Host "       CONFIGURING ANDROID ENVIRONMENT"
        Write-Host "================================================"
        Write-Host ""

        $androidHome = $env:ANDROID_HOME

        if (-not $androidHome) {
            $androidHome = $env:ANDROID_SDK_ROOT
        }

        if (-not $androidHome) {
            Write-Error "ANDROID_HOME / ANDROID_SDK_ROOT not found."
            exit 1
        }

        Write-Host "ANDROID_HOME = $androidHome"

        "ANDROID_HOME=$androidHome" |
          Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        "ANDROID_SDK_ROOT=$androidHome" |
          Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        "$androidHome\platform-tools" |
          Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

        "$androidHome\emulator" |
          Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

        "$androidHome\cmdline-tools\latest\bin" |
          Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

        Write-Host ""
        Write-Host "Android environment configured."


    # =========================================================
    # ANDROID SDK
    # =========================================================

    - name: Install Android SDK components
      shell: powershell
      run: |

        Write-Host ""
        Write-Host "================================================"
        Write-Host "       INSTALLING ANDROID SDK"
        Write-Host "================================================"
        Write-Host ""

        $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"

        if (-not (Test-Path $sdkmanager)) {

            Write-Error "sdkmanager not found at:"
            Write-Error $sdkmanager

            exit 1
        }


        Write-Host "Accepting Android SDK licenses..."

        & $sdkmanager --licenses


        Write-Host ""
        Write-Host "Installing Android SDK components..."


        & $sdkmanager `
          "platform-tools" `
          "emulator" `
          "build-tools;35.0.0" `
          "platforms;android-35" `
          "system-images;android-35;google_apis;x86_64"


        if ($LASTEXITCODE -ne 0) {

            Write-Error "Android SDK installation failed."

            exit 1
        }


        Write-Host ""
        Write-Host "Android SDK components installed successfully."


    # =========================================================
    # VERIFY ANDROID TOOLS
    # =========================================================

    - name: Verify Android tools
      shell: powershell
      run: |

        Write-Host ""
        Write-Host "================================================"
        Write-Host "       VERIFYING ANDROID TOOLS"
        Write-Host "================================================"
        Write-Host ""

        Write-Host "ADB:"
        adb version

        Write-Host ""
        Write-Host "Emulator:"
        emulator -version

        Write-Host ""
        Write-Host "SDK Manager:"
        sdkmanager --version

        Write-Host ""
        Write-Host "Android tools are available."


    # =========================================================
    # INSTALL APPIUM
    # =========================================================

    - name: Install Appium
      shell: powershell
      run: |

        Write-Host ""
        Write-Host "================================================"
        Write-Host "       INSTALLING APPIUM"
        Write-Host "================================================"
        Write-Host ""

        Write-Host "Node version:"
        node --version

        Write-Host ""
        Write-Host "NPM version:"
        npm --version

        Write-Host ""
        Write-Host "Installing Appium globally..."

        npm install -g appium


        if ($LASTEXITCODE -ne 0) {

            Write-Error "Appium installation failed."

            exit 1
        }


        Write-Host ""
        Write-Host "Appium version:"
        appium --version


        # -----------------------------------------------------
        # Install UiAutomator2 driver
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "Installing UiAutomator2 driver..."

        appium driver install uiautomator2


        if ($LASTEXITCODE -ne 0) {

            Write-Error "UiAutomator2 driver installation failed."

            exit 1
        }


        Write-Host ""
        Write-Host "Installed Appium drivers:"

        appium driver list --installed


        Write-Host ""
        Write-Host "Appium installation completed."


    # =========================================================
    # CREATE ANDROID EMULATOR
    # =========================================================

    - name: Create Android emulator
      shell: powershell
      run: |

        Write-Host ""
        Write-Host "================================================"
        Write-Host "       CREATING ANDROID EMULATOR"
        Write-Host "================================================"
        Write-Host ""

        # -----------------------------------------------------
        # IMPORTANT:
        #
        # DEVICE_NAME=Android is an Appium capability.
        #
        # It is NOT the AVD name.
        #
        # We therefore use a fixed CI AVD name.
        # -----------------------------------------------------

        $avdName = "CI_Android"


        Write-Host "AVD name: $avdName"


        # -----------------------------------------------------
        # Check whether AVD already exists
        # -----------------------------------------------------

        $existingAvd = avdmanager list avd |
          Select-String "Name:\s+$avdName"


        if (-not $existingAvd) {

            Write-Host "Creating AVD..."

            cmd /c "echo no | avdmanager create avd -n $avdName -k `"system-images;android-35;google_apis;x86_64`" -d pixel_6"


            if ($LASTEXITCODE -ne 0) {

                Write-Error "Failed to create Android emulator."

                exit 1
            }

        }
        else {

            Write-Host "AVD already exists."
        }


        Write-Host ""
        Write-Host "Available AVDs:"

        emulator -list-avds


    # =========================================================
    # START ANDROID EMULATOR
    # =========================================================

    - name: Start Android emulator
      shell: powershell
      run: |

        Write-Host ""
        Write-Host "================================================"
        Write-Host "       STARTING ANDROID EMULATOR"
        Write-Host "================================================"
        Write-Host ""

        $avdName = "CI_Android"

        $udid = "emulator-5554"

        $headless = "${{ inputs.headless }}"


        Write-Host "AVD       : $avdName"
        Write-Host "UDID      : $udid"
        Write-Host "Headless  : $headless"
        Write-Host ""


        # -----------------------------------------------------
        # Emulator arguments
        # -----------------------------------------------------

        if ($headless -eq "true") {

            Write-Host "Starting emulator in HEADLESS mode..."

            $arguments = `
              "@$avdName -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect"

        }
        else {

            Write-Host "Starting emulator in HEADED mode..."

            $arguments = `
              "@$avdName -no-audio -no-boot-anim -gpu swiftshader_indirect"
        }


        # -----------------------------------------------------
        # Start emulator
        # -----------------------------------------------------

        Start-Process `
          -FilePath "emulator.exe" `
          -ArgumentList $arguments `
          -RedirectStandardOutput "$env:RUNNER_TEMP\emulator.log" `
          -RedirectStandardError "$env:RUNNER_TEMP\emulator-error.log" `
          -WindowStyle Hidden


        Write-Host "Emulator process started."


        # -----------------------------------------------------
        # Start ADB
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "Starting ADB..."

        adb start-server


        # -----------------------------------------------------
        # Wait for emulator to appear
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "Waiting for emulator: $udid"


        $deviceDetected = $false


        for ($i = 0; $i -lt 60; $i++) {

            $devices = adb devices

            Write-Host "ADB check $($i + 1)/60"

            if ($devices -match "$udid\s+device") {

                $deviceDetected = $true

                Write-Host ""
                Write-Host "Emulator detected."

                break
            }

            Start-Sleep -Seconds 2
        }


        if (-not $deviceDetected) {

            Write-Host ""
            Write-Host "Emulator failed to appear in ADB."

            Write-Host ""
            Write-Host "ADB devices:"
            adb devices


            Write-Host ""
            Write-Host "========== EMULATOR OUTPUT =========="

            if (Test-Path "$env:RUNNER_TEMP\emulator.log") {
                Get-Content "$env:RUNNER_TEMP\emulator.log"
            }


            Write-Host ""
            Write-Host "========== EMULATOR ERROR =========="

            if (Test-Path "$env:RUNNER_TEMP\emulator-error.log") {
                Get-Content "$env:RUNNER_TEMP\emulator-error.log"
            }


            exit 1
        }


        # -----------------------------------------------------
        # Wait for Android boot
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "Waiting for Android boot..."


        $bootCompleted = $false


        for ($i = 0; $i -lt 60; $i++) {

            $boot = adb -s $udid shell getprop sys.boot_completed 2>$null

            Write-Host "Boot status: $boot"


            if ($boot.Trim() -eq "1") {

                $bootCompleted = $true

                break
            }


            Start-Sleep -Seconds 3
        }


        if (-not $bootCompleted) {

            Write-Host ""
            Write-Host "Android failed to complete boot."


            Write-Host ""
            Write-Host "ADB devices:"
            adb devices


            Write-Host ""
            Write-Host "========== EMULATOR OUTPUT =========="

            if (Test-Path "$env:RUNNER_TEMP\emulator.log") {
                Get-Content "$env:RUNNER_TEMP\emulator.log"
            }


            Write-Host ""
            Write-Host "========== EMULATOR ERROR =========="

            if (Test-Path "$env:RUNNER_TEMP\emulator-error.log") {
                Get-Content "$env:RUNNER_TEMP\emulator-error.log"
            }


            exit 1
        }


        # -----------------------------------------------------
        # Disable animations
        # -----------------------------------------------------

        if ($env:DISABLE_WINDOW_ANIMATION -eq "true") {

            Write-Host ""
            Write-Host "Disabling Android animations..."

            adb -s $udid shell settings put global window_animation_scale 0

            adb -s $udid shell settings put global transition_animation_scale 0

            adb -s $udid shell settings put global animator_duration_scale 0
        }


        # -----------------------------------------------------
        # Final device check
        # -----------------------------------------------------

        Write-Host ""
        Write-Host "================================================"
        Write-Host "       ANDROID EMULATOR READY"
        Write-Host "================================================"
        Write-Host ""

        adb devices

        Write-Host ""
        Write-Host "Emulator: $udid"
        Write-Host "Status: READY"
        Write-Host ""
