name: 'Run Tests'
description: 'Starts Appium server, triggers TestNG, and stops Appium'

inputs:
  server-port:
    description: 'Port for the Appium server'
    required: true
    default: '4723'

runs:
  using: "composite"
  steps:
    # =========================================================
    # START APPIUM SERVER
    # =========================================================
    - name: Start Appium server
      shell: powershell
      env:
        APPIUM_PORT: ${{ inputs.server-port }}
      run: |
        Write-Host "=========================================="
        Write-Host "STARTING APPIUM SERVER"
        Write-Host "=========================================="

        Write-Host "Starting Appium on port $env:APPIUM_PORT"

        $appiumLog = Join-Path $env:GITHUB_WORKSPACE "appium.log"
        $appiumErrorLog = Join-Path $env:GITHUB_WORKSPACE "appium-error.log"
        $appiumPidFile = Join-Path $env:GITHUB_WORKSPACE "appium.pid"

        # Remove old logs
        if (Test-Path $appiumLog) { Remove-Item $appiumLog -Force }
        if (Test-Path $appiumErrorLog) { Remove-Item $appiumErrorLog -Force }
        if (Test-Path $appiumPidFile) { Remove-Item $appiumPidFile -Force }

        Write-Host "Appium stdout: $appiumLog"
        Write-Host "Appium stderr: $appiumErrorLog"

        # Start Appium. stdout and stderr MUST use different files on Windows.
        $process = Start-Process `
            -FilePath "appium" `
            -ArgumentList "--port", $env:APPIUM_PORT `
            -RedirectStandardOutput $appiumLog `
            -RedirectStandardError $appiumErrorLog `
            -PassThru `
            -WindowStyle Hidden

        if ($null -eq $process) {
            throw "Failed to start Appium process."
        }

        Write-Host "Appium process started."
        Write-Host "PID: $($process.Id)"

        $process.Id | Out-File -FilePath $appiumPidFile -Encoding ascii

        Write-Host ""
        Write-Host "Waiting for Appium server..."

        $timeout = 60
        $elapsed = 0
        $ready = $false

        while ($elapsed -lt $timeout) {
            try {
                $response = Invoke-WebRequest `
                    -Uri "http://127.0.0.1:$env:APPIUM_PORT/status" `
                    -UseBasicParsing `
                    -TimeoutSec 3 `
                    -ErrorAction Stop

                if ($response.StatusCode -eq 200) {
                    $ready = $true
                    Write-Host ""
                    Write-Host "Appium server is READY."
                    break
                }
            }
            catch {
                # Appium is still starting.
            }

            # Check whether process died
            $runningProcess = Get-Process -Id $process.Id -ErrorAction SilentlyContinue

            if ($null -eq $runningProcess) {
                Write-Host ""
                Write-Host "Appium process exited unexpectedly."

                if (Test-Path $appiumLog) {
                    Write-Host ""
                    Write-Host "========== APPIUM STDOUT =========="
                    Get-Content $appiumLog
                }

                if (Test-Path $appiumErrorLog) {
                    Write-Host ""
                    Write-Host "========== APPIUM STDERR =========="
                    Get-Content $appiumErrorLog
                }

                throw "Appium server process terminated before becoming ready."
            }

            Start-Sleep -Seconds 2
            $elapsed += 2
            Write-Host "Waiting for Appium... $elapsed/$timeout seconds"
        }

        if (-not $ready) {
            Write-Host ""
            Write-Host "=========================================="
            Write-Host "APPIUM STARTUP FAILED"
            Write-Host "=========================================="

            Write-Host ""
            Write-Host "Appium STDOUT:"
            if (Test-Path $appiumLog) { Get-Content $appiumLog }

            Write-Host ""
            Write-Host "Appium STDERR:"
            if (Test-Path $appiumErrorLog) { Get-Content $appiumErrorLog }

            throw "Appium server did not become ready within $timeout seconds."
        }

        Write-Host ""
        Write-Host "Appium server running on:"
        Write-Host "http://127.0.0.1:$env:APPIUM_PORT"

    # =========================================================
    # RUN MAVEN TESTS
    # =========================================================
    - name: Run Maven TestNG Suite
      shell: bash
      run: mvn clean test -DsuiteXmlFile=testng.xml

    # =========================================================
    # STOP APPIUM
    # =========================================================
    - name: Stop Appium
      if: always()
      shell: powershell
      run: |
        Write-Host "=========================================="
        Write-Host "STOPPING APPIUM"
        Write-Host "=========================================="

        $appiumPidFile = Join-Path $env:GITHUB_WORKSPACE "appium.pid"

        if (Test-Path $appiumPidFile) {
            $appiumPid = Get-Content $appiumPidFile
            Write-Host "Appium PID: $appiumPid"

            try {
                $process = Get-Process -Id ([int]$appiumPid) -ErrorAction SilentlyContinue

                if ($null -ne $process) {
                    Stop-Process -Id ([int]$appiumPid) -Force
                    Write-Host "Appium process stopped."
                }
                else {
                    Write-Host "Appium process is already stopped."
                }
            }
            catch {
                Write-Warning "Unable to stop Appium process: $($_.Exception.Message)"
            }

            Remove-Item $appiumPidFile -Force -ErrorAction SilentlyContinue
        }
        else {
            Write-Host "Appium PID file not found."
        }
