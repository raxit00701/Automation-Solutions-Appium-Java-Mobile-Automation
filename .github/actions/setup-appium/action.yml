name: Setup Appium Android

description: >
  Prepare Java, Node, Maven, Appium, Android SDK and start
  the existing local Android emulator.

inputs:
  environment:
    description: GitHub Environment name
    required: true

  emulator-mode:
    description: head or headless
    required: true
    default: headless

  avd-name:
    description: Android Virtual Device name
    required: true
    default: Pixel_API_35

  emulator-path:
    description: Path to emulator.exe
    required: true
    default: C:\Android\emulator\emulator.exe

runs:
  using: composite

  steps:

    # ---------------------------------------------------------
    # Java
    # ---------------------------------------------------------

    - name: Setup Java 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
        cache: maven

    # ---------------------------------------------------------
    # Node
    # ---------------------------------------------------------

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm

    # ---------------------------------------------------------
    # Load GitHub Environment configuration
    # ---------------------------------------------------------

    - name: Load environment configuration
      shell: powershell
      env:
        ENV_CONFIG: ${{ vars[inputs.environment] }}
      run: |
        Write-Host "Loading environment: ${{ inputs.environment }}"

        if ([string]::IsNullOrWhiteSpace($env:ENV_CONFIG)) {
            throw "No configuration found for GitHub Environment '${{ inputs.environment }}'."
        }

        $lines = $env:ENV_CONFIG -split "`r?`n"

        foreach ($line in $lines) {

            $line = $line.Trim()

            if ([string]::IsNullOrWhiteSpace($line)) {
                continue
            }

            if ($line.StartsWith("#")) {
                continue
            }

            if ($line -notmatch "^([^=]+)=(.*)$") {
                Write-Warning "Skipping invalid environment line: $line"
                continue
            }

            $name = $Matches[1].Trim()
            $value = $Matches[2].Trim()

            "$name=$value" | Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

            Write-Host "Loaded $name"
        }

    # ---------------------------------------------------------
    # Verify Java / Maven
    # ---------------------------------------------------------

    - name: Verify Java
      shell: powershell
      run: |
        java -version
        mvn -version

    # ---------------------------------------------------------
    # Install Appium
    # ---------------------------------------------------------

    - name: Install Appium
      shell: powershell
      run: |
        $appium = Get-Command appium -ErrorAction SilentlyContinue

        if ($null -eq $appium) {
            Write-Host "Appium not found. Installing..."
            npm install -g appium
        }
        else {
            Write-Host "Appium already installed:"
            appium --version
        }

    # ---------------------------------------------------------
    # Install UiAutomator2 driver
    # ---------------------------------------------------------

    - name: Install UiAutomator2 driver
      shell: powershell
      run: |
        appium driver list --installed

        appium driver list --installed |
          Select-String "uiautomator2"

        if ($LASTEXITCODE -ne 0) {
            appium driver install uiautomator2
        }

        appium driver list --installed

    # ---------------------------------------------------------
    # Verify ADB
    # ---------------------------------------------------------

    - name: Verify ADB
      shell: powershell
      run: |
        $adb = if ($env:ADB_PATH) {
            $env:ADB_PATH
        } else {
            "adb"
        }

        & $adb version

    # ---------------------------------------------------------
    # Verify emulator
    # ---------------------------------------------------------

    - name: Verify emulator
      shell: powershell
      env:
        EMULATOR_PATH: ${{ inputs.emulator-path }}
      run: |
        if (-not (Test-Path $env:EMULATOR_PATH)) {
            throw "Android emulator not found at $env:EMULATOR_PATH"
        }

        Write-Host "Emulator:"
        & $env:EMULATOR_PATH -version

    # ---------------------------------------------------------
    # Start emulator
    # ---------------------------------------------------------

    - name: Start Android emulator
      shell: powershell
      env:
        EMULATOR_PATH: ${{ inputs.emulator-path }}
        AVD_NAME: ${{ inputs.avd-name }}
        EMULATOR_MODE: ${{ inputs.emulator-mode }}
      run: |

        Write-Host "Starting AVD: $env:AVD_NAME"
        Write-Host "Mode: $env:EMULATOR_MODE"

        $adb = if ($env:ADB_PATH) {
            $env:ADB_PATH
        } else {
            "adb"
        }

        # Check if emulator already exists
        $devices = & $adb devices

        if ($devices -match "emulator-5554\s+device") {
            Write-Host "emulator-5554 is already running."
        }
        else {

            $arguments = @(
                "-avd", $env:AVD_NAME,
                "-verbose"
            )

            if ($env:EMULATOR_MODE -eq "headless") {
                $arguments += "-no-window"
                $arguments += "-no-audio"
                $arguments += "-no-boot-anim"
            }

            Write-Host "Launching emulator..."

            Start-Process `
                -FilePath $env:EMULATOR_PATH `
                -ArgumentList $arguments `
                -WorkingDirectory (Split-Path $env:EMULATOR_PATH) `
                -PassThru
        }

    # ---------------------------------------------------------
    # Wait for emulator
    # ---------------------------------------------------------

    - name: Wait for Android emulator
      shell: powershell
      run: |

        $adb = if ($env:ADB_PATH) {
            $env:ADB_PATH
        } else {
            "adb"
        }

        Write-Host "Waiting for emulator..."

        & $adb wait-for-device

        $timeout = 300
        $elapsed = 0

        while ($elapsed -lt $timeout) {

            $boot = (& $adb shell getprop sys.boot_completed 2>$null).Trim()

            Write-Host "boot_completed = '$boot'"

            if ($boot -eq "1") {
                break
            }

            Start-Sleep -Seconds 5
            $elapsed += 5
        }

        if ($elapsed -ge $timeout) {
            Write-Host "ADB devices:"
            & $adb devices

            throw "Android emulator failed to boot within $timeout seconds."
        }

        Write-Host "Android emulator is ready."

        & $adb devices
