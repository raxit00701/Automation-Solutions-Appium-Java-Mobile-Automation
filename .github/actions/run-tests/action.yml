name: Run Appium Tests

description: >
  Start Appium server and execute Maven Appium/TestNG tests.

inputs:
  server-port:
    description: Appium server port
    required: true
    default: '4724'

  test-directory:
    description: Test source directory
    required: true
    default: 'src/test/java/tests'

runs:
  using: composite

  steps:

    # ---------------------------------------------------------
    # Clean old Appium / Allure data
    # ---------------------------------------------------------

    - name: Clean previous test output
      shell: powershell
      run: |
        if (Test-Path "allure-results") {
            Remove-Item "allure-results" -Recurse -Force
        }

        if (Test-Path "allure-report") {
            Remove-Item "allure-report" -Recurse -Force
        }

        New-Item -ItemType Directory -Force -Path "allure-results" | Out-Null

    # ---------------------------------------------------------
    # Start Appium
    # ---------------------------------------------------------

    - name: Start Appium server
      shell: powershell
      env:
        APPIUM_PORT: ${{ inputs.server-port }}
      run: |

        Write-Host "Starting Appium on port $env:APPIUM_PORT"

        $logFile = Join-Path $env:GITHUB_WORKSPACE "appium.log"

        $process = Start-Process `
            -FilePath "appium" `
            -ArgumentList "--port", $env:APPIUM_PORT `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError $logFile `
            -PassThru

        $process.Id | Out-File `
            -FilePath "$env:GITHUB_WORKSPACE\appium.pid" `
            -Encoding ascii

        Write-Host "Appium PID: $($process.Id)"

        $ready = $false

        for ($i = 0; $i -lt 30; $i++) {

            try {
                $response = Invoke-WebRequest `
                    -Uri "http://127.0.0.1:$env:APPIUM_PORT/status" `
                    -UseBasicParsing `
                    -TimeoutSec 2

                if ($response.StatusCode -eq 200) {
                    $ready = $true
                    break
                }
            }
            catch {
                Start-Sleep -Seconds 2
            }
        }

        if (-not $ready) {
            Write-Host "Appium log:"
            if (Test-Path $logFile) {
                Get-Content $logFile
            }

            throw "Appium server failed to start."
        }

        Write-Host "Appium server is ready."

    # ---------------------------------------------------------
    # Run Maven
    # ---------------------------------------------------------

    - name: Run Appium TestNG tests
      shell: powershell
      run: |

        Write-Host "Environment: $env:ENVIRONMENT"
        Write-Host "Package: $env:APP_PACKAGE"
        Write-Host "Activity: $env:APP_ACTIVITY"

        mvn --batch-mode test `
          -DserverPort=4724 `
          -Dudid=emulator-5554 `
          -DsystemPort=8200 `
          -DchromePort=9515

    # ---------------------------------------------------------
    # Always save diagnostics
    # ---------------------------------------------------------

    - name: Capture emulator diagnostics
      if: always()
      shell: powershell
      run: |

        $adb = if ($env:ADB_PATH) {
            $env:ADB_PATH
        } else {
            "adb"
        }

        & $adb devices | Out-File "adb-devices.txt"

        & $adb shell getprop | Out-File "android-properties.txt"

    # ---------------------------------------------------------
    # Stop Appium
    # ---------------------------------------------------------

    - name: Stop Appium
      if: always()
      shell: powershell
      run: |

        if (Test-Path "$env:GITHUB_WORKSPACE\appium.pid") {

            $pid = Get-Content "$env:GITHUB_WORKSPACE\appium.pid"

            try {
                Stop-Process -Id $pid -Force -ErrorAction Stop
                Write-Host "Appium stopped."
            }
            catch {
                Write-Host "Appium process already stopped."
            }
        }
