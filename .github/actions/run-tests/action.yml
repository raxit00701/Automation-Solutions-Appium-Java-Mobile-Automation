name: 'Run Tests'
description: 'Start Appium server, execute Maven Appium tests, and capture diagnostics.'

inputs:
  server-port:
    description: 'Appium server port'
    required: true
    default: '4724'

runs:
  using: "composite"
  steps:
    - name: Clean previous test output
      shell: powershell
      run: |
        if (Test-Path "allure-results") { Remove-Item "allure-results" -Recurse -Force }
        if (Test-Path "allure-report") { Remove-Item "allure-report" -Recurse -Force }
        New-Item -ItemType Directory -Force -Path "allure-results" | Out-Null

    - name: Start Appium server
      shell: powershell
      env:
        APPIUM_PORT: ${{ inputs.server-port }}
      run: |
        $appiumLog = Join-Path $env:GITHUB_WORKSPACE "appium.log"
        $appiumErrorLog = Join-Path $env:GITHUB_WORKSPACE "appium-error.log"
        $appiumPidFile = Join-Path $env:GITHUB_WORKSPACE "appium.pid"
        if (Test-Path $appiumLog) { Remove-Item $appiumLog -Force }
        if (Test-Path $appiumErrorLog) { Remove-Item $appiumErrorLog -Force }
        if (Test-Path $appiumPidFile) { Remove-Item $appiumPidFile -Force }

        # FIXED: appium.cmd is strictly required for Start-Process on Windows
        $process = Start-Process `
            -FilePath "appium.cmd" `
            -ArgumentList "--port", $env:APPIUM_PORT `
            -RedirectStandardOutput $appiumLog `
            -RedirectStandardError $appiumErrorLog `
            -PassThru `
            -WindowStyle Hidden

        if ($null -eq $process) { throw "Failed to start Appium process." }
        $process.Id | Out-File -FilePath $appiumPidFile -Encoding ascii

        $timeout = 60
        $elapsed = 0
        $ready = $false
        while ($elapsed -lt $timeout) {
            try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$env:APPIUM_PORT/status" -UseBasicParsing -TimeoutSec 3 -ErrorAction Stop
                if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch { }
            Start-Sleep -Seconds 2
            $elapsed += 2
        }
        if (-not $ready) { throw "Appium server failed to start within $timeout seconds." }

    - name: Run Appium TestNG tests
      shell: powershell
      run: |
        mvn --batch-mode test `
          -DserverPort=${{ inputs.server-port }} `
          -Dudid=emulator-5554 `
          -DsystemPort=8200 `
          -DchromePort=9515

    - name: Capture emulator diagnostics
      if: always()
      shell: powershell
      run: |
        $adb = if ([string]::IsNullOrWhiteSpace($env:ADB_PATH)) { "adb" } else { $env:ADB_PATH }
        & $adb devices | Out-File "adb-devices.txt"
        & $adb shell getprop | Out-File "android-properties.txt"

    - name: Stop Appium
      if: always()
      shell: powershell
      run: |
        $appiumPidFile = Join-Path $env:GITHUB_WORKSPACE "appium.pid"
        if (Test-Path $appiumPidFile) {
            $appiumPid = Get-Content $appiumPidFile
            try {
                $process = Get-Process -Id ([int]$appiumPid) -ErrorAction SilentlyContinue
                if ($null -ne $process) { Stop-Process -Id ([int]$appiumPid) -Force }
            } catch { }
            Remove-Item $appiumPidFile -Force -ErrorAction SilentlyContinue
        }
