name: Appium Mobile Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - prod
      is_headless:
        description: 'Run Emulator in Headless Mode (-no-window)'
        required: true
        default: true
        type: boolean

jobs:
  run-appium-tests:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches ~/.m2/repository

      - name: Prepare Dynamic Environment Variables
        shell: pwsh
        run: |
          $envName = "${{ github.event.inputs.environment }}"
          
          # 1. Save to GitHub Actions inbuilt variables for workflow access
          echo "ENVIRONMENT=$envName" >> $env:GITHUB_ENV
          
          # 2. Generate the .env file for your java-dotenv library
          $envContent = @"
          ENVIRONMENT=$envName
          PLATFORM_NAME=Android
          AUTOMATION_NAME=UiAutomator2
          DEVICE_NAME=Android
          ADB_PATH=adb
          CHROMEDRIVER_EXECUTABLE=C:\chromedriver.exe
          ADB_EXEC_TIMEOUT=60
          NEW_COMMAND_TIMEOUT=300
          APP_WAIT_FOR_QUIESCENCE=false
          DISABLE_WINDOW_ANIMATION=true
          AUTO_GRANT_PERMISSIONS=true
          UNICODE_KEYBOARD=true
          RESET_KEYBOARD=true
          WAIT_FOR_IDLE_TIMEOUT=0
          "@
          
          if ($envName -eq "qa") {
              $envContent += "`nAPP_PACKAGE=com.swaglabsmobileapp"
              $envContent += "`nAPP_ACTIVITY=.SplashActivity"
              $envContent += "`nAPP_WAIT_ACTIVITY=*"
          } elseif ($envName -eq "staging") {
              $envContent += "`nAPP_PACKAGE=com.example.staging"
              $envContent += "`nAPP_ACTIVITY=.SplashActivity"
              $envContent += "`nAPP_WAIT_ACTIVITY=*"
          } elseif ($envName -eq "prod") {
              $envContent += "`nAPP_PACKAGE=com.example.prod"
              $envContent += "`nAPP_ACTIVITY=.SplashActivity"
              $envContent += "`nAPP_WAIT_ACTIVITY=*"
          }
          
          $envContent | Out-File -FilePath .env -Encoding utf8
          Write-Host "Created .env file for $envName environment."

      - name: Start Appium Server
        shell: pwsh
        run: |
          # Start Appium on the port specified in your testng.xml (4724)
          Start-Process -FilePath "appium" -ArgumentList "--port 4724" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          Write-Host "Appium Server started."

      - name: Start Local Emulator
        shell: pwsh
        run: |
          $emulatorArgs = "-avd Pixel_API_35 -verbose"
          if ("${{ github.event.inputs.is_headless }}" -eq "true") {
              $emulatorArgs += " -no-window"
          }
          Write-Host "Starting Emulator with args: $emulatorArgs"
          
          Start-Process -FilePath "C:\Android\emulator\emulator.exe" -ArgumentList $emulatorArgs -WindowStyle Hidden
          
          Write-Host "Waiting for emulator to come online..."
          adb wait-for-device
          
          # Wait until boot completes
          $booted = $false
          for ($i = 0; $i -lt 90; $i++) {
              $status = adb shell getprop sys.boot_completed
              if ($status -match "1") {
                  Write-Host "Emulator booted successfully!"
                  $booted = $true
                  break
              }
              Start-Sleep -Seconds 2
          }
          
          if (-not $booted) {
              Write-Error "Emulator failed to boot within timeout."
              exit 1
          }

      - name: Run Tests
        run: mvn clean verify
        continue-on-error: true # Ensures artifacts upload even if a test fails

      - name: Cache Allure History
        uses: actions/cache@v4
        with:
          path: .allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-

      - name: Upload Allure Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.event.inputs.environment }}
          path: allure-results/
          retention-days: 14

      - name: Upload TestNG Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports-${{ github.event.inputs.environment }}
          path: target/surefire-reports/
          retention-days: 14

      - name: Teardown - Kill Emulator & Appium
        if: always()
        shell: pwsh
        run: |
          # Shut down the emulator gracefully
          adb -s emulator-5554 emu kill
          
          # Kill Appium process running on port 4724
          $appiumProcess = Get-NetTCPConnection -LocalPort 4724 -ErrorAction SilentlyContinue
          if ($appiumProcess) {
              Stop-Process -Id $appiumProcess.OwningProcess -Force
              Write-Host "Appium server stopped."
          }
