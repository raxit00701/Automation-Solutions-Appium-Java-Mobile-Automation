name: Appium Mobile Tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run the tests against'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - prod
      headless:
        description: 'Run Emulator in Headless mode'
        required: true
        default: true
        type: boolean

jobs:
  mobile-tests:
    runs-on: self-hosted # Requires your local Windows machine connected as a runner
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 1. Setup Appium & Dependencies
        uses: ./.github/actions/setup-appium
        with:
          environment: ${{ inputs.environment }}

      - name: 2. Run Emulator & Tests
        uses: ./.github/actions/run-tests
        with:
          headless: ${{ inputs.headless }}

      - name: 3. Generate Reports & Artifacts
        if: always() # Runs even if the tests fail
        uses: ./.github/actions/allure-report
