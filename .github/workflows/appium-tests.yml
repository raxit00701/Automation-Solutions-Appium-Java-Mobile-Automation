name: Appium Mobile Tests

on:

  workflow_dispatch:

    inputs:

      environment:
        description: Test environment
        required: true
        type: choice
        default: QA

        options:
          - QA
          - STAGE
          - PROD

      emulator_mode:
        description: Android emulator display mode
        required: true
        type: choice
        default: headless

        options:
          - headless
          - head

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:

  appium-tests:

    name: Appium Android Tests

    runs-on:
      - self-hosted
      - windows
      - x64
      - appium-android

    # -------------------------------------------------------
    # GitHub Environment
    # -------------------------------------------------------

    environment: ${{ inputs.environment || 'QA' }}

    timeout-minutes: 60

    steps:

      # -----------------------------------------------------
      # Checkout
      # -----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # -----------------------------------------------------
      # Show runner information
      # -----------------------------------------------------

      - name: Runner information
        shell: powershell
        run: |

          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner architecture: $env:RUNNER_ARCH"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      # -----------------------------------------------------
      # Setup Appium / Android
      # -----------------------------------------------------

      - name: Setup Appium
        uses: ./.github/actions/setup-appium

        with:

          environment: ${{ inputs.environment || 'QA' }}

          emulator-mode: ${{ inputs.emulator_mode || 'headless' }}

          avd-name: Pixel_API_35

          emulator-path: C:\Android\emulator\emulator.exe

      # -----------------------------------------------------
      # Run tests
      # -----------------------------------------------------

      - name: Run Appium tests
        uses: ./.github/actions/run-tests

        with:

          server-port: '4724'

          test-directory: src/test/java/tests

      # -----------------------------------------------------
      # Allure
      # -----------------------------------------------------

      - name: Generate Allure report
        if: always()
        uses: ./.github/actions/allure-report
