name: Appium Mobile Automation

on:
  # ===========================================================
  # RUN ON PUSH
  # ===========================================================
  push:
    branches:
      - main
      - develop

  # ===========================================================
  # RUN ON PULL REQUEST
  # ===========================================================
  pull_request:
    branches:
      - main
      - develop

  # ===========================================================
  # MANUAL RUN
  # ===========================================================
  workflow_dispatch:
    inputs:
      environment:
        description: Select test environment
        required: true
        type: choice
        default: QA
        options:
          - QA
          - STAGING
          - PROD

      headless:
        description: Run Android emulator headless
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'


# ===========================================================
# JOB
# ===========================================================
jobs:
  appium-tests:
    name: Appium Android Tests
    runs-on: windows-latest

    # ========================================================
    # GITHUB ENVIRONMENT
    # ========================================================
    environment:
      name: ${{ inputs.environment || 'QA' }}

    # ========================================================
    # GLOBAL VARIABLES
    # ========================================================
    env:
      APPIUM_ENV_CONFIG: ${{ vars[inputs.environment || 'QA'] }}
      HEADLESS: ${{ inputs.headless || 'true' }}
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

    steps:
      # ======================================================
      # CHECKOUT
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # CACHE MAVEN
      # ======================================================
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ======================================================
      # CACHE APPIUM
      # ======================================================
      - name: Cache Appium
        uses: actions/cache@v4
        with:
          path: ~/.appium
          key: ${{ runner.os }}-appium-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-appium-

      # ======================================================
      # LOAD ENVIRONMENT CONFIGURATION
      # ======================================================
      - name: Load environment configuration
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "================================================"
          Write-Host "       LOADING APPIUM ENVIRONMENT"
          Write-Host "================================================"
          Write-Host ""

          $config = $env:APPIUM_ENV_CONFIG

          if ([string]::IsNullOrWhiteSpace($config)) {
              Write-Error "Environment configuration is empty."
              Write-Host ""
              Write-Host "Expected one of:"
              Write-Host "  QA"
              Write-Host "  STAGING"
              Write-Host "  PROD"
              exit 1
          }

          Write-Host "Configuration received successfully."
          Write-Host ""

          foreach ($line in ($config -split "`r?`n")) {
              $line = $line.Trim()

              if ([string]::IsNullOrWhiteSpace($line) -or $line.StartsWith("#")) {
                  continue
              }

              $parts = $line -split '=', 2
              if ($parts.Count -ne 2) {
                  Write-Warning "Skipping invalid line: $line"
                  continue
              }

              $key = $parts[0].Trim()
              $value = $parts[1].Trim()

              if ([string]::IsNullOrWhiteSpace($key)) { continue }

              "$key=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              Write-Host "Loaded: $key"
          }

          Write-Host ""
          Write-Host "Environment configuration loaded successfully."
          Write-Host "================================================"
          Write-Host ""

      # ======================================================
      # SETUP APPIUM / ANDROID
      # ======================================================
      - name: Setup Appium environment
        uses: ./.github/actions/setup-appium
        with:
          headless: ${{ env.HEADLESS }}

      # ======================================================
      # VALIDATE CONFIGURATION
      # ======================================================
      - name: Validate environment configuration
        shell: powershell
        run: |
          $requiredVariables = @(
              "ENVIRONMENT", "APP_ACTIVITY", "APP_WAIT_ACTIVITY",
              "PLATFORM_NAME", "AUTOMATION_NAME", "DEVICE_NAME", "ADB_PATH",
              "ADB_EXEC_TIMEOUT", "CHROMEDRIVER_EXECUTABLE", "NEW_COMMAND_TIMEOUT",
              "APP_WAIT_FOR_QUIESCENCE", "WAIT_FOR_IDLE_TIMEOUT", "DISABLE_WINDOW_ANIMATION",
              "AUTO_GRANT_PERMISSIONS", "UNICODE_KEYBOARD", "RESET_KEYBOARD"
          )

          $missing = @()
          foreach ($variable in $requiredVariables) {
              $value = [Environment]::GetEnvironmentVariable($variable)
              if ([string]::IsNullOrWhiteSpace($value)) {
                  $missing += $variable
              }
          }

          if ($missing.Count -gt 0) {
              Write-Host ""
              Write-Host "Missing environment variables:"
              foreach ($variable in $missing) { Write-Host "  - $variable" }
              exit 1
          }

          Write-Host ""
          Write-Host "All required environment variables are loaded."
          Write-Host ""

      # ======================================================
      # INSTALL APK & EXTRACT PACKAGE NAME
      # ======================================================
      - name: Install application APK
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "       INSTALLING APPLICATION"
          Write-Host "======================================"

          $apkPath = Join-Path $env:GITHUB_WORKSPACE "src\main\resources\test.apk"
          Write-Host "APK path: $apkPath"

          if (-not (Test-Path $apkPath)) {
              Write-Error "APK not found: $apkPath"
              exit 1
          }

          Write-Host "APK found successfully."
          
          # Extract actual Package Name from APK using aapt
          $buildTools = Get-ChildItem -Path "$env:ANDROID_HOME\build-tools" | Sort-Object Name -Descending | Select-Object -First 1
          $aapt = Join-Path $buildTools.FullName "aapt.exe"
          
          $packageLine = & $aapt dump badging $apkPath | Select-String "package: name="
          if ($packageLine -match "name='([^']+)'") {
              $extractedPackage = $matches[1]
              Write-Host ""
              Write-Host "Dynamically overriding APP_PACKAGE to actual APK package: $extractedPackage"
              "APP_PACKAGE=$extractedPackage" | Out-File -FilePath $env:GITHUB_ENV -Append
              $package = $extractedPackage
          } else {
              Write-Warning "Could not extract package name via aapt. Falling back to env vars."
              $package = $env:APP_PACKAGE
          }

          Write-Host ""
          Write-Host "Connected Android devices:"
          adb devices

          Write-Host ""
          Write-Host "Installing APK..."
          adb install -r "$apkPath"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "APK installation failed."
              exit 1
          }

          Write-Host ""
          Write-Host "APK installed successfully."

          Write-Host ""
          Write-Host "Checking application package presence on device..."
          $installed = adb shell pm list packages | Select-String $package

          if (-not $installed) {
              Write-Error "Package '$package' was not found after APK installation."
              exit 1
          }

          Write-Host "Package '$package' is verified on the emulator."
          Write-Host ""
          Write-Host "======================================"
          Write-Host "      APPLICATION READY"
          Write-Host "======================================"
          Write-Host ""

      # ======================================================
      # DISPLAY CONFIGURATION
      # ======================================================
      - name: Display test configuration
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "================================================"
          Write-Host "       APPIUM MOBILE AUTOMATION"
          Write-Host "================================================"
          Write-Host "Execution Configuration"
          Write-Host "------------------------------------------------"
          Write-Host "GitHub Environment : ${{ inputs.environment || 'QA' }}"
          Write-Host "Application Env    : $env:ENVIRONMENT"
          Write-Host "Headless           : $env:HEADLESS"
          
          Write-Host ""
          Write-Host "Application"
          Write-Host "------------------------------------------------"
          Write-Host "Package            : $env:APP_PACKAGE"
          Write-Host "Activity           : $env:APP_ACTIVITY"
          Write-Host "Wait Activity      : $env:APP_WAIT_ACTIVITY"
          
          Write-Host ""
          Write-Host "Appium / Devices"
          Write-Host "------------------------------------------------"
          Write-Host "Platform           : $env:PLATFORM_NAME"
          Write-Host "Device             : $env:DEVICE_NAME"
          Write-Host "ChromeDriver       : $env:CHROMEDRIVER_EXECUTABLE"
          Write-Host "================================================"

      # ======================================================
      # RUN TESTS
      # ======================================================
      - name: Run Appium tests
        uses: ./.github/actions/run-tests
        with:
          test-dir: src/test/java/tests
          udid: emulator-5554
          server-port: 4723
          system-port: 8200
          chrome-port: 9515

      # ======================================================
      # ALLURE
      # ======================================================
      - name: Generate Allure report and upload artifacts
        if: always()
        uses: ./.github/actions/allure-report
