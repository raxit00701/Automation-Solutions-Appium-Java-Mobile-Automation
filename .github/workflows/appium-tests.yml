
name: Appium Mobile Automation

on:

  # -----------------------------------------------------------
  # RUN ON PUSH
  # -----------------------------------------------------------
  push:
    branches:
      - main
      - develop

  # -----------------------------------------------------------
  # RUN ON PULL REQUEST
  # -----------------------------------------------------------
  pull_request:
    branches:
      - main
      - develop

  # -----------------------------------------------------------
  # MANUAL RUN
  # -----------------------------------------------------------
  workflow_dispatch:

    inputs:

      environment:
        description: Select test environment
        required: true
        type: choice
        default: QA
        options:
          - QA
          - STAGING
          - PROD

      headless:
        description: Run Android emulator headless
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'


# ===========================================================
# JOBS
# ===========================================================

jobs:

  appium-tests:

    name: Appium Android Tests

    runs-on: windows-latest

    # --------------------------------------------------------
    # GITHUB ENVIRONMENT
    #
    # This connects the job to:
    # QA / STAGING / PROD
    # --------------------------------------------------------
    environment:
      name: ${{ inputs.environment || 'QA' }}

    # --------------------------------------------------------
    # ENVIRONMENT VARIABLES
    #
    # These are loaded from the selected GitHub Environment.
    # --------------------------------------------------------
    env:

      # ------------------------------------------------------
      # APPLICATION
      # ------------------------------------------------------

      ENVIRONMENT: ${{ vars.ENVIRONMENT }}

      APP_PACKAGE: ${{ vars.APP_PACKAGE }}

      APP_ACTIVITY: ${{ vars.APP_ACTIVITY }}

      APP_WAIT_ACTIVITY: ${{ vars.APP_WAIT_ACTIVITY }}


      # ------------------------------------------------------
      # APPIUM CAPABILITIES
      # ------------------------------------------------------

      PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}

      AUTOMATION_NAME: ${{ vars.AUTOMATION_NAME }}

      DEVICE_NAME: ${{ vars.DEVICE_NAME }}


      # ------------------------------------------------------
      # ADB
      # ------------------------------------------------------

      ADB_PATH: ${{ vars.ADB_PATH }}

      ADB_EXEC_TIMEOUT: ${{ vars.ADB_EXEC_TIMEOUT }}


      # ------------------------------------------------------
      # CHROMEDRIVER
      # ------------------------------------------------------

      CHROMEDRIVER_EXECUTABLE: ${{ vars.CHROMEDRIVER_EXECUTABLE }}


      # ------------------------------------------------------
      # APPIUM TIMEOUTS
      # ------------------------------------------------------

      NEW_COMMAND_TIMEOUT: ${{ vars.NEW_COMMAND_TIMEOUT }}

      APP_WAIT_FOR_QUIESCENCE: ${{ vars.APP_WAIT_FOR_QUIESCENCE }}

      WAIT_FOR_IDLE_TIMEOUT: ${{ vars.WAIT_FOR_IDLE_TIMEOUT }}


      # ------------------------------------------------------
      # ANDROID SETTINGS
      # ------------------------------------------------------

      DISABLE_WINDOW_ANIMATION: ${{ vars.DISABLE_WINDOW_ANIMATION }}

      AUTO_GRANT_PERMISSIONS: ${{ vars.AUTO_GRANT_PERMISSIONS }}

      UNICODE_KEYBOARD: ${{ vars.UNICODE_KEYBOARD }}

      RESET_KEYBOARD: ${{ vars.RESET_KEYBOARD }}


      # ------------------------------------------------------
      # EXECUTION MODE
      # ------------------------------------------------------

      HEADLESS: ${{ inputs.headless || 'true' }}


      # ------------------------------------------------------
      # JAVA
      # ------------------------------------------------------

      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # DISPLAY CONFIGURATION
      # ======================================================

      - name: Display test configuration
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host "       APPIUM MOBILE AUTOMATION"
          Write-Host "=============================================="

          Write-Host "GitHub Environment : ${{ inputs.environment || 'QA' }}"
          Write-Host "Application Env    : $env:ENVIRONMENT"
          Write-Host "App Package        : $env:APP_PACKAGE"
          Write-Host "App Activity       : $env:APP_ACTIVITY"
          Write-Host "Platform           : $env:PLATFORM_NAME"
          Write-Host "Automation         : $env:AUTOMATION_NAME"
          Write-Host "Device             : $env:DEVICE_NAME"
          Write-Host "ADB                : $env:ADB_PATH"
          Write-Host "Headless           : $env:HEADLESS"

          Write-Host "=============================================="


      # ======================================================
      # SETUP APPIUM
      # ======================================================

      - name: Setup Appium environment
        uses: ./.github/actions/setup-appium
        with:
          headless: ${{ env.HEADLESS }}


      # ======================================================
      # RUN TESTS
      # ======================================================

      - name: Run Appium tests
        uses: ./.github/actions/run-tests
        with:
          test-dir: src/test/java/tests


      # ======================================================
      # ALLURE + ARTIFACTS
      # ======================================================

      - name: Generate Allure report and upload artifacts
        if: always()
        uses: ./.github/actions/allure-report
```
