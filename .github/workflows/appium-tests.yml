name: Appium Mobile Tests

on:

  workflow_dispatch:

    inputs:

      environment:
        description: Test environment
        required: true
        type: choice
        default: QA

        options:
          - QA
          - STAGE
          - PROD

      emulator_mode:
        description: Android emulator display mode
        required: true
        type: choice
        default: headless

        options:
          - headless
          - head


jobs:

  appium-tests:

    name: Appium Android Tests

    runs-on:
      - self-hosted
      - windows
      - x64

    environment: ${{ inputs.environment }}

    timeout-minutes: 60

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # SHOW SELECTED ENVIRONMENT
      # ======================================================

      - name: Show selected environment
        shell: powershell
        run: |
          Write-Host "Selected environment: ${{ inputs.environment }}"
          Write-Host "Emulator mode: ${{ inputs.emulator_mode }}"

      # ======================================================
      # SETUP APPIUM
      # ======================================================

      - name: Setup Appium
        uses: ./.github/actions/setup-appium

        with:

          environment: ${{ inputs.environment }}

          environment-config: |
            ${{ vars.ENV_CONFIG }}

          emulator-mode: ${{ inputs.emulator_mode }}

          avd-name: Pixel_API_35

          emulator-path: C:\Android\emulator\emulator.exe

      # ======================================================
      # RUN TESTS
      # ======================================================

      - name: Run Appium tests
        uses: ./.github/actions/run-tests

        with:

          server-port: '4724'

          test-directory: src/test/java/tests

      # ======================================================
      # ALLURE
      # ======================================================

      - name: Generate Allure report
        if: always()
        uses: ./.github/actions/allure-report
