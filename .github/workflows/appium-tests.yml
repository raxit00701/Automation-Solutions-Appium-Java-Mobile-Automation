name: Appium Mobile Automation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Test environment"
        required: true
        type: choice
        options:
          - QA
          - STAGE
          - PROD
        default: QA

      emulator_mode:
        description: "Emulator mode"
        required: true
        type: choice
        options:
          - headless
          - headed
        default: headless

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  ANDROID_HOME: "C:\\Android"
  ANDROID_AVD: "Pixel_API_35"
  ANDROID_SERIAL: "emulator-5554"
  EMULATOR_EXECUTABLE: "C:\\Android\\emulator\\emulator.exe"
  EMULATOR_BOOT_TIMEOUT: "180"

  APPIUM_PORT: "4724"
  APPIUM_SERVER_URL: "http://127.0.0.1:4724"
  SYSTEM_PORT: "8200"

  MAVEN_OPTS: "-Xmx2048m"

jobs:
  mobile-tests:
    name: Appium - ${{ inputs.environment || 'QA' }}

    runs-on:
      - self-hosted
      - Windows

    environment:
      name: ${{ inputs.environment || 'QA' }}

    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify tools
        shell: powershell
        run: |
          java -version
          mvn -version
          adb version
          appium --version

          if (-not (Test-Path $env:EMULATOR_EXECUTABLE)) {
            Write-Error "Emulator not found: $env:EMULATOR_EXECUTABLE"
            exit 1
          }

          & $env:EMULATOR_EXECUTABLE -version

      - name: Cache Appium
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.appium
          key: appium-uiautomator2-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: |
            appium-uiautomator2-${{ runner.os }}-${{ runner.arch }}-

     
      - name: Ensure UiAutomator2
        shell: powershell
        run: |
          Write-Host "Checking Appium drivers..."

          appium driver list

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Appium driver list returned exit code $LASTEXITCODE."
            Write-Host "Attempting to install UiAutomator2..."

            appium driver install uiautomator2

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to install UiAutomator2 driver."
              exit 1
            }
          }

          Write-Host "Appium drivers:"
          appium driver list



      - name: Prepare directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path allure-results | Out-Null
          New-Item -ItemType Directory -Force -Path allure-report | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          New-Item -ItemType Directory -Force -Path logs | Out-Null

      - name: Show configuration
        shell: powershell
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          APP_PACKAGE: ${{ vars.APP_PACKAGE }}
          APP_ACTIVITY: ${{ vars.APP_ACTIVITY }}
          PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}
          AUTOMATION_NAME: ${{ vars.AUTOMATION_NAME }}
          DEVICE_NAME: ${{ vars.DEVICE_NAME }}
        run: |
          Write-Host "Environment : $env:ENVIRONMENT"
          Write-Host "Package     : $env:APP_PACKAGE"
          Write-Host "Activity    : $env:APP_ACTIVITY"
          Write-Host "Platform    : $env:PLATFORM_NAME"
          Write-Host "Automation  : $env:AUTOMATION_NAME"
          Write-Host "Device      : $env:DEVICE_NAME"
          Write-Host "AVD         : $env:ANDROID_AVD"
          Write-Host "UDID        : $env:ANDROID_SERIAL"
          Write-Host "Mode        : ${{ inputs.emulator_mode || 'headless' }}"

      - name: Clean previous run
        shell: powershell
        continue-on-error: true
        run: |
          $connections = Get-NetTCPConnection `
            -LocalPort $env:APPIUM_PORT `
            -State Listen `
            -ErrorAction SilentlyContinue

          foreach ($connection in $connections) {
            Stop-Process `
              -Id $connection.OwningProcess `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Get-Process emulator -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          adb kill-server 2>$null

          Start-Sleep -Seconds 2

      - name: Start ADB
        shell: powershell
        run: |
          adb start-server
          adb devices

      - name: Start emulator
        shell: powershell
        run: |
          $mode = "${{ inputs.emulator_mode || 'headless' }}"

          if ($mode -eq "headless") {
            Start-Process `
              -FilePath $env:EMULATOR_EXECUTABLE `
              -ArgumentList @(
                "-avd",
                $env:ANDROID_AVD,
                "-no-window",
                "-no-audio",
                "-no-boot-anim",
                "-gpu",
                "swiftshader_indirect"
              ) `
              -RedirectStandardOutput "$PWD\logs\emulator.log" `
              -RedirectStandardError "$PWD\logs\emulator-error.log"
          }
          else {
            Start-Process `
              -FilePath $env:EMULATOR_EXECUTABLE `
              -ArgumentList @(
                "-avd",
                $env:ANDROID_AVD,
                "-no-boot-anim"
              ) `
              -RedirectStandardOutput "$PWD\logs\emulator.log" `
              -RedirectStandardError "$PWD\logs\emulator-error.log"
          }

      
      - name: Wait for emulator
        shell: powershell
        run: |
          $timeout = [int]$env:EMULATOR_BOOT_TIMEOUT
          $elapsed = 0
          $serial = $env:ANDROID_SERIAL

          Write-Host "Waiting for emulator: $serial"

          while ($elapsed -lt $timeout) {
            $device = adb devices |
              Select-String "$serial\s+device"

            if ($null -ne $device) {
              $boot = adb -s $serial shell getprop sys.boot_completed 2>$null

              if (($boot | Out-String).Trim() -eq "1") {
                Write-Host "Emulator ready."
                break
              }
            }

            Start-Sleep -Seconds 5
            $elapsed += 5
          }

          if ($elapsed -ge $timeout) {
            Write-Error "Emulator failed to boot."

            adb devices

            if (Test-Path "logs\emulator.log") {
              Get-Content "logs\emulator.log" -Tail 200
            }

            exit 1
          }


     
      - name: Configure emulator
        shell: powershell
        run: |
          adb -s $env:ANDROID_SERIAL shell settings put global window_animation_scale 0
          adb -s $env:ANDROID_SERIAL shell settings put global transition_animation_scale 0
          adb -s $env:ANDROID_SERIAL shell settings put global animator_duration_scale 0

          adb -s $env:ANDROID_SERIAL shell getprop ro.build.version.release
          adb -s $env:ANDROID_SERIAL shell getprop ro.product.model

      - name: Start Appium
        shell: powershell
        run: |
          Start-Process `
            -FilePath "appium" `
            -ArgumentList @(
              "--address",
              "127.0.0.1",
              "--port",
              $env:APPIUM_PORT,
              "--log-level",
              "info"
            ) `
            -RedirectStandardOutput "$PWD\logs\appium.log" `
            -RedirectStandardError "$PWD\logs\appium-error.log"

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "$env:APPIUM_SERVER_URL/status" `
                -UseBasicParsing `
                -TimeoutSec 3

              if ($response.StatusCode -eq 200) {
                $ready = $true
                break
              }
            }
            catch {}

            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            Write-Error "Appium failed to start."

            if (Test-Path "logs\appium.log") {
              Get-Content "logs\appium.log" -Tail 200
            }

            exit 1
          }

          Write-Host "Appium ready."

      - name: Run tests
        shell: powershell
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          APP_PACKAGE: ${{ vars.APP_PACKAGE }}
          APP_ACTIVITY: ${{ vars.APP_ACTIVITY }}
          APP_WAIT_ACTIVITY: ${{ vars.APP_WAIT_ACTIVITY }}
          PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}
          AUTOMATION_NAME: ${{ vars.AUTOMATION_NAME }}
          DEVICE_NAME: ${{ vars.DEVICE_NAME }}
          ADB_PATH: ${{ vars.ADB_PATH }}
          ADB_EXEC_TIMEOUT: ${{ vars.ADB_EXEC_TIMEOUT }}
          NEW_COMMAND_TIMEOUT: ${{ vars.NEW_COMMAND_TIMEOUT }}
          APP_WAIT_FOR_QUIESCENCE: ${{ vars.APP_WAIT_FOR_QUIESCENCE }}
          DISABLE_WINDOW_ANIMATION: ${{ vars.DISABLE_WINDOW_ANIMATION }}
          AUTO_GRANT_PERMISSIONS: ${{ vars.AUTO_GRANT_PERMISSIONS }}
          UNICODE_KEYBOARD: ${{ vars.UNICODE_KEYBOARD }}
          RESET_KEYBOARD: ${{ vars.RESET_KEYBOARD }}
          WAIT_FOR_IDLE_TIMEOUT: ${{ vars.WAIT_FOR_IDLE_TIMEOUT }}

        run: |
          mvn clean test `
            -Denv="$env:ENVIRONMENT" `
            -DappPackage="$env:APP_PACKAGE" `
            -DappActivity="$env:APP_ACTIVITY" `
            -DappWaitActivity="$env:APP_WAIT_ACTIVITY" `
            -DplatformName="$env:PLATFORM_NAME" `
            -DautomationName="$env:AUTOMATION_NAME" `
            -DdeviceName="$env:DEVICE_NAME" `
            -Dudid="$env:ANDROID_SERIAL" `
            -DappiumServerUrl="$env:APPIUM_SERVER_URL" `
            -DserverPort="$env:APPIUM_PORT" `
            -DsystemPort="$env:SYSTEM_PORT" `
            -DadbPath="$env:ADB_PATH" `
            -DadbExecTimeout="$env:ADB_EXEC_TIMEOUT" `
            -DnewCommandTimeout="$env:NEW_COMMAND_TIMEOUT" `
            -DappWaitForQuiescence="$env:APP_WAIT_FOR_QUIESCENCE" `
            -DdisableWindowAnimation="$env:DISABLE_WINDOW_ANIMATION" `
            -DautoGrantPermissions="$env:AUTO_GRANT_PERMISSIONS" `
            -DunicodeKeyboard="$env:UNICODE_KEYBOARD" `
            -DresetKeyboard="$env:RESET_KEYBOARD" `
            -DwaitForIdleTimeout="$env:WAIT_FOR_IDLE_TIMEOUT"

      - name: Generate Allure report
        if: always()
        shell: powershell
        run: |
          if (Test-Path "allure-results") {
            $files = Get-ChildItem "allure-results" -File -ErrorAction SilentlyContinue

            if ($files.Count -gt 0) {
              mvn allure:report `
                -Dallure.results.directory="$PWD\allure-results" `
                -Dallure.report.directory="$PWD\allure-report"
            }
          }

      - name: Collect artifacts
        if: always()
        shell: powershell
        run: |
          if (Test-Path "target\surefire-reports") {
            Copy-Item `
              "target\surefire-reports" `
              "artifacts\surefire-reports" `
              -Recurse `
              -Force
          }

          if (Test-Path "allure-results") {
            Copy-Item `
              "allure-results" `
              "artifacts\allure-results" `
              -Recurse `
              -Force
          }

          if (Test-Path "allure-report") {
            Copy-Item `
              "allure-report" `
              "artifacts\allure-report" `
              -Recurse `
              -Force
          }

          if (Test-Path "logs") {
            Copy-Item `
              "logs" `
              "artifacts\logs" `
              -Recurse `
              -Force
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-${{ inputs.environment || 'QA' }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: powershell
        continue-on-error: true
        run: |
          $connections = Get-NetTCPConnection `
            -LocalPort $env:APPIUM_PORT `
            -State Listen `
            -ErrorAction SilentlyContinue

          foreach ($connection in $connections) {
            Stop-Process `
              -Id $connection.OwningProcess `
              -Force `
              -ErrorAction SilentlyContinue
          }

          adb -s $env:ANDROID_SERIAL emu kill 2>$null

          Start-Sleep -Seconds 5

          Get-Process emulator -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

