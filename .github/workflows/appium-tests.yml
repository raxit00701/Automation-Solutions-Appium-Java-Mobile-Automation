name: Appium Mobile Automation

on:

  # ===========================================================
  # RUN ON PUSH
  # ===========================================================
  push:
    branches:
      - main
      - develop

  # ===========================================================
  # RUN ON PULL REQUEST
  # ===========================================================
  pull_request:
    branches:
      - main
      - develop

  # ===========================================================
  # MANUAL RUN
  # ===========================================================
  workflow_dispatch:

    inputs:

      environment:
        description: Select test environment
        required: true
        type: choice
        default: QA
        options:
          - QA
          - STAGING
          - PROD

      headless:
        description: Run Android emulator headless
        required: true
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'


# ===========================================================
# JOBS
# ===========================================================

jobs:

  appium-tests:

    name: Appium Android Tests

    runs-on: windows-latest

    # ========================================================
    # GITHUB ENVIRONMENT
    # ========================================================

    environment:
      name: ${{ inputs.environment || 'QA' }}


    # ========================================================
    # GLOBAL ENVIRONMENT
    #
    # Each GitHub Environment contains ONE variable:
    #
    # QA      -> variable named QA
    # STAGING -> variable named STAGING
    # PROD    -> variable named PROD
    #
    # The selected variable contains the complete
    # KEY=VALUE configuration.
    # ========================================================

    env:

      APPIUM_ENV_CONFIG: ${{ vars[inputs.environment || 'QA'] }}

      HEADLESS: ${{ inputs.headless || 'true' }}

      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # LOAD ENVIRONMENT CONFIGURATION
      # ======================================================

      - name: Load environment configuration
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "================================================"
          Write-Host "       LOADING APPIUM ENVIRONMENT"
          Write-Host "================================================"

          $config = $env:APPIUM_ENV_CONFIG

          if ([string]::IsNullOrWhiteSpace($config)) {

              Write-Error "Environment configuration is empty."

              Write-Host ""
              Write-Host "Expected GitHub Environment variables:"
              Write-Host "  QA      -> multiline QA configuration"
              Write-Host "  STAGING -> multiline STAGING configuration"
              Write-Host "  PROD    -> multiline PROD configuration"

              exit 1
          }

          Write-Host "Configuration received successfully."
          Write-Host ""

          # --------------------------------------------------
          # Parse each KEY=VALUE line
          # --------------------------------------------------

          foreach ($line in ($config -split "`r?`n")) {

              $line = $line.Trim()

              # Skip empty lines
              if ([string]::IsNullOrWhiteSpace($line)) {
                  continue
              }

              # Skip comments
              if ($line.StartsWith("#")) {
                  continue
              }

              # Split only on the FIRST '='
              $parts = $line -split '=', 2

              if ($parts.Count -ne 2) {

                  Write-Warning "Skipping invalid configuration line: $line"

                  continue
              }

              $key = $parts[0].Trim()
              $value = $parts[1].Trim()

              if ([string]::IsNullOrWhiteSpace($key)) {
                  continue
              }

              # Write variable for all following GitHub Actions steps
              "$key=$value" | Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Append `
                  -Encoding utf8

              Write-Host "Loaded: $key"
          }

          Write-Host ""
          Write-Host "Environment configuration loaded successfully."
          Write-Host "================================================"
          Write-Host ""


      # ======================================================
      # VALIDATE CONFIGURATION
      # ======================================================

      - name: Validate environment configuration
        shell: powershell
        run: |

          $requiredVariables = @(
              "ENVIRONMENT",
              "APP_PACKAGE",
              "APP_ACTIVITY",
              "APP_WAIT_ACTIVITY",
              "PLATFORM_NAME",
              "AUTOMATION_NAME",
              "DEVICE_NAME",
              "ADB_PATH",
              "ADB_EXEC_TIMEOUT",
              "CHROMEDRIVER_EXECUTABLE",
              "NEW_COMMAND_TIMEOUT",
              "APP_WAIT_FOR_QUIESCENCE",
              "WAIT_FOR_IDLE_TIMEOUT",
              "DISABLE_WINDOW_ANIMATION",
              "AUTO_GRANT_PERMISSIONS",
              "UNICODE_KEYBOARD",
              "RESET_KEYBOARD"
          )

          $missing = @()

          foreach ($variable in $requiredVariables) {

              $value = [Environment]::GetEnvironmentVariable($variable)

              if ([string]::IsNullOrWhiteSpace($value)) {
                  $missing += $variable
              }
          }

          if ($missing.Count -gt 0) {

              Write-Host ""
              Write-Host "Missing environment variables:"
              $missing | ForEach-Object {
                  Write-Host "  - $_"
              }

              exit 1
          }

          Write-Host "All required environment variables are loaded."


      # ======================================================
      # DISPLAY CONFIGURATION
      # ======================================================

      - name: Display test configuration
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "================================================"
          Write-Host "       APPIUM MOBILE AUTOMATION"
          Write-Host "================================================"

          Write-Host ""
          Write-Host "Execution Configuration"
          Write-Host "------------------------------------------------"

          Write-Host "GitHub Environment : ${{ inputs.environment || 'QA' }}"
          Write-Host "Application Env    : $env:ENVIRONMENT"
          Write-Host "Headless           : $env:HEADLESS"

          Write-Host ""
          Write-Host "Application"
          Write-Host "------------------------------------------------"

          Write-Host "Package            : $env:APP_PACKAGE"
          Write-Host "Activity           : $env:APP_ACTIVITY"
          Write-Host "Wait Activity      : $env:APP_WAIT_ACTIVITY"

          Write-Host ""
          Write-Host "Appium"
          Write-Host "------------------------------------------------"

          Write-Host "Platform           : $env:PLATFORM_NAME"
          Write-Host "Automation         : $env:AUTOMATION_NAME"
          Write-Host "Device             : $env:DEVICE_NAME"

          Write-Host ""
          Write-Host "ADB"
          Write-Host "------------------------------------------------"

          Write-Host "ADB Path           : $env:ADB_PATH"
          Write-Host "ADB Timeout        : $env:ADB_EXEC_TIMEOUT"

          Write-Host ""
          Write-Host "ChromeDriver"
          Write-Host "------------------------------------------------"

          Write-Host "Executable         : $env:CHROMEDRIVER_EXECUTABLE"

          Write-Host ""
          Write-Host "Timeouts"
          Write-Host "------------------------------------------------"

          Write-Host "New Command        : $env:NEW_COMMAND_TIMEOUT"
          Write-Host "Wait Idle          : $env:WAIT_FOR_IDLE_TIMEOUT"

          Write-Host ""
          Write-Host "Android Settings"
          Write-Host "------------------------------------------------"

          Write-Host "Window Animation   : $env:DISABLE_WINDOW_ANIMATION"
          Write-Host "Auto Grant         : $env:AUTO_GRANT_PERMISSIONS"
          Write-Host "Unicode Keyboard   : $env:UNICODE_KEYBOARD"
          Write-Host "Reset Keyboard     : $env:RESET_KEYBOARD"

          Write-Host ""
          Write-Host "================================================"
          Write-Host ""


      # ======================================================
      # SETUP APPIUM
      # ======================================================

      - name: Setup Appium environment
        uses: ./.github/actions/setup-appium
        with:
          headless: ${{ env.HEADLESS }}


      # ======================================================
      # RUN TESTS
      # ======================================================

      - name: Run Appium tests
        uses: ./.github/actions/run-tests
        with:
          test-dir: src/test/java/tests


      # ======================================================
      # ALLURE + ARTIFACTS
      # ======================================================

      - name: Generate Allure report and upload artifacts
        if: always()
        uses: ./.github/actions/allure-report
